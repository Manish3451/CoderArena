services:
  - type: web
    name: codearena-api
    runtime: python
    pythonVersion: "3.11"
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn arena.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: "production"
      # The following must be set in the Render dashboard
      # (Service > Environment > Add Environment Variable):
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MOONSHOT_API_KEY
        sync: false
